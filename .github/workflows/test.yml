name: Build & Test

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Toxon.StepFunctionTesting.slnx

      - name: Build
        run: dotnet build Toxon.StepFunctionTesting.slnx --configuration Release --no-restore

      - name: Publish tests
        run: dotnet publish Toxon.StepFunctionTesting.Tests/Toxon.StepFunctionTesting.Tests.csproj --configuration Release --no-build -o test-output

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output
          retention-days: 1
