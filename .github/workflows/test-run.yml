name: AWS Test Run

# Runs after "PR" completes. Unlike a pull_request trigger, workflow_run
# always executes using the workflow definition from the default branch, in the base
# repo's security context - so it has access to secrets and OIDC (id-token: write)
# even for PRs from forks. We check out and build the PR's commit ourselves (rather
# than reusing binaries built by the fork-safe workflow) because tools like
# Verify.NUnit resolve their `.verified.txt` snapshots via the source tree, not the
# build output - AWS credentials are only configured after the build step, so
# untrusted build-time code (NuGet/MSBuild) never runs with secrets present.

on:
  workflow_run:
    workflows: [ "PR" ]
    types: [ completed ]

env:
  AWS_REGION: eu-west-2
  # super locked down - only allows `states:TestState` from `will14smith/Toxon.StepFunctionTesting`
  AWS_TEST_ROLE_ARN: arn:aws:iam::682179218046:role/gha-StepFunctionTesting

permissions:
  contents: read
  id-token: write
  checks: write
  statuses: write

jobs:
  test:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Set status to pending
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }} \
            -f state=pending \
            -f context='AWS Test Run' \
            -f description='Running tests against AWS...'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Toxon.StepFunctionTesting.slnx

      - name: Build
        run: dotnet build Toxon.StepFunctionTesting.slnx --configuration Release --no-restore

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test
        id: test
        run: dotnet test Toxon.StepFunctionTesting.Tests/Toxon.StepFunctionTesting.Tests.csproj --configuration Release --no-build

      - name: Set final status
        if: always()
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }} \
            -f state='${{ steps.test.outcome == 'success' && 'success' || 'failure' }}' \
            -f context='AWS Test Run' \
            -f description='Tests ${{ steps.test.outcome == 'success' && 'passed' || 'failed' }}' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
