name: PR

# This is the fork-safe approval gate: pull_request runs from forked repos never get
# secrets/OIDC (id-token: write), regardless of "require approval for external
# contributors" - only build here to give contributors fast feedback. The AWS-backed
# test run happens in test-run.yml (triggered via workflow_run once this completes),
# which runs in the base repo's context and so has access to OIDC/secrets.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Toxon.StepFunctionTesting.slnx

      - name: Build
        run: dotnet build Toxon.StepFunctionTesting.slnx --configuration Release --no-restore
